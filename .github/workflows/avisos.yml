name: Avisos de directo

on:
  schedule:
    # respaldo: GitHub solo lo lanza cada varias horas. El ritmo de 5 min lo da cron-job.org
    # llamando a «workflow_dispatch» (ver README)
    - cron: "2-59/5 * * * *"
  workflow_dispatch:             # cron-job.org cada 5 min, o el botón "Run workflow" para probar
    inputs:
      saludo:
        description: "Enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write                # para guardar estado.json (qué directos ya se avisaron)

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # el estado más reciente, aunque esta ejecución estuviera en cola
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Revisar quién está en directo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SALUDO: ${{ inputs.saludo }}
        run: python avisos.py
      - name: Guardar estado
        run: |
          if ! git diff --quiet estado.json; then
            git config user.name "clipforge-avisos"
            git config user.email "clipforge-avisos@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: directos avisados"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 3
            done
          fi
